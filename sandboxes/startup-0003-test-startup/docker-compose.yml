services:
  db:
    image: postgres:16
    container_name: startup_0003_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup
      POSTGRES_DB: startupdb
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - startup_net

  n8n:
    image: n8nio/n8n:latest
    container_name: startup_0003_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Kolkata
      - DB_TYPE=sqlite
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - startup_net

  web:
    image: node:20-alpine
    container_name: startup_0003_web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000"
    environment:
      - DATABASE_URL=postgresql://startup:startup@db:5432/startupdb
      - PORT=3000
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
    networks:
      - startup_net

volumes:
  db_data:
  n8n_data:

networks:
  startup_net:
    driver: bridge
